[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-speaking-assessment-mora-core"
version = "0.3.0"
description = "Mora-aware Japanese ASR utilities and Whisper auxiliary heads"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SHOTA Moriwaki" }]
dependencies = []

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26",
]
train = [
  "torch>=2.2",
  "transformers>=4.45",
]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
