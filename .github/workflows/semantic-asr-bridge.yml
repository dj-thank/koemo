name: Koemo Semantic ASR bridge contracts

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install bridge-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile bridge modules
        run: |
          python -m compileall -q koemo/semantic_asr_bridge.py koemo/authoritative_transcription.py koemo/semantic_asr_settings.py

      - name: Run bridge contract tests
        run: |
          python -m pytest -q tests/test_semantic_asr_bridge.py tests/test_authoritative_transcription.py tests/test_semantic_asr_settings.py
