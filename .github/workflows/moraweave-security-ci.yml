name: MoraWeave Security CI

on:
  push:
    branches:
      - public/moraweave-v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-teacher-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moraweave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_local_teacher.py
