name: Japanese Complete Transcription CI

on:
  push:
    branches:
      - public/japanese-complete-transcription-v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q japanese_transcriber scripts training tests
      - run: python -m unittest -v tests.test_complete_transcription
      - run: python -m unittest -v tests.test_python_components

  node-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
